name: Publicar PWA en GitHub Pages

# Publica la PWA en GitHub Pages. Requiere activar Pages UNA sola vez:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Mientras no esté activado, este workflow avisa y termina sin error.
on:
  push:
    branches: ["main"]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Regenerar data.json
        run: python3 tools/build_data.py

      - name: ¿Pages está activado?
        id: estado
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "activado=true" >> "$GITHUB_OUTPUT"
          else
            echo "activado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages no está activado. Ve a Settings → Pages → Build and deployment → Source: GitHub Actions (una sola vez) y vuelve a ejecutar este workflow."
          fi

      - name: Saltar despliegue (Pages sin activar)
        if: steps.estado.outputs.activado == 'false'
        run: |
          echo "### PWA lista, pero Pages aún no está activado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La app funciona igual: local con \`python3 -m http.server 8000 --directory web\` o instalándola desde la vista previa." >> "$GITHUB_STEP_SUMMARY"
          echo "Para publicarla: **Settings → Pages → Build and deployment → Source: GitHub Actions** y re-ejecuta este workflow." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        if: steps.estado.outputs.activado == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.estado.outputs.activado == 'true'
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.estado.outputs.activado == 'true'
