name: Publicar PWA en GitHub Pages

# Requiere Pages activado en Settings > Pages > Source: GitHub Actions.
# Es opcional: la PWA también funciona instalándola desde la vista previa local.
on:
  push:
    branches: ["main"]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Necesario para que configure-pages pueda activar Pages solo la primera vez
  administration: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Regenerar data.json
        run: python3 tools/build_data.py
      - uses: actions/configure-pages@v5
        with:
          # Habilita Pages automáticamente si aún no está activado
          # (Settings > Pages > Source: GitHub Actions).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
